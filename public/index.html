<!DOCTYPE html>
<html dir="rtl" lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="متجر ستريم ستور  - نوفر لك حسابات Netflix و Shahid و Disney+ وغيرها بأفضل الأسعار. خدمة عملاء 24/7 وتوصيل فوري وضمان 100%"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Almarai:wght@300;400;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <script
      src="https://kit.fontawesome.com/cac80d2547.js"
      crossorigin="anonymous"
    ></script>
    <script crossorigin src="../src/index.js"></script>
    <title>متجر ستريم ستور - أفضل الاشتراكات بأقل الأسعار</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>

<header class="py-3 text-center" dir="rtl" style="background: transparent">
  <header class="py-3 text-center" dir="rtl" style="background: transparent">
    <!--
        Logo display: the <picture> element tries to load PNG first (if you place
        a `streamstore-logo.png` in this folder), otherwise it falls back to the
        generated SVG. To use your PNG, add the file to `public/` and it will be
        picked automatically.
      -->
    <picture>
      <source srcset="%PUBLIC_URL%/streamstore-logo.png" type="image/png" />
      <img
        src="%PUBLIC_URL%/logo.png"
        alt="متجر ستريم ستور"
        style="max-height: 80px; width: auto"
      />
    </picture>
  </header>
</header>

<div id="root"></div>
